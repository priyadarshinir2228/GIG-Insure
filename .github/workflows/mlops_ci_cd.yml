name: GigEase MLOps CI/CD & Automated Retraining Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly continuous retraining pipeline trigger (every Sunday at midnight)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  mlops-ci-pipeline:
    name: Continuous Integration & Model Test Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MLFLOW_ALLOW_FILE_STORE: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Data Validation Pipeline (Stage 1)
        run: |
          python src/data/run_data_collection.py

      - name: Execute Feature Engineering Pipeline (Stage 2)
        run: |
          python src/features/run_stage2_pipeline.py

      - name: Run PyTest Automated Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Execute Model Training & MLflow Logging (Stage 3)
        run: |
          python src/models/run_stage3_pipeline.py

      - name: Execute Drift Monitoring & Continuous Retraining Check (Stage 5)
        run: |
          python src/models/monitor_drift.py

  github-packages-publish:
    name: Publish Container Image to GitHub Packages (GHCR)
    needs: mlops-ci-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Image to GitHub Packages
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.string.outputs.REPO_LC }}:latest
            ghcr.io/${{ steps.string.outputs.REPO_LC }}:${{ github.sha }}
